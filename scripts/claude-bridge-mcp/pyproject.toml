[project]
name = "claude-bridge-mcp"
version = "0.2.0"
description = "MCP server that lets Claude Desktop drive Unity Editor via ClaudeBridge file IPC"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "zaffre" }]
license = { text = "MIT" }
dependencies = [
    # 상한 고정: mcp 2.0.0 에서 `mcp.server.fastmcp` 가 제거되어
    # server.py 의 `from mcp.server.fastmcp import FastMCP` 가 깨진다.
    # 2.x 로 올리려면 server.py 를 새 API 로 마이그레이션한 뒤 해제할 것.
    "mcp>=1.0.0,<2",
]

[project.scripts]
# 이 이름이 pipx 설치 후 쉘·Claude Desktop 설정에서 부를 명령입니다.
claude-bridge-mcp = "claude_bridge_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claude_bridge_mcp*"]
